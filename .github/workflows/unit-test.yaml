name: Unit test charm

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit test
    if: "!github.event.pull_request.draft"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run unit tests
        run: make test
