# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.
# This configuration requires Charmcraft 4.

type: charm
platforms:
  ubuntu@20.04:amd64:
  ubuntu@20.04:arm64:
  ubuntu@20.04:ppc64el:
  ubuntu@20.04:s390x:
  ubuntu@22.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@22.04:ppc64el:
  ubuntu@22.04:s390x:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:
  ubuntu@24.04:ppc64el:
  ubuntu@24.04:s390x:

parts:
  # Charmcraft validates that this part exists before running the uv plugin.
  uv-deps:
    plugin: nil
    build-packages:
      - curl
    override-build: |
      curl -LsSf https://astral.sh/uv/0.10.8/install.sh | sh
      ln -sf "$HOME/.local/bin/uv" /usr/local/bin/uv
  charm:
    plugin: uv
    source: .
    after:
      - uv-deps
